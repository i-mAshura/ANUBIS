<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="ANUBIS - The Obsidian Control Plane" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="90%">
      <stop offset="0" stop-color="#4a0710"/>
      <stop offset="0.55" stop-color="#14040a"/>
      <stop offset="1" stop-color="#070102"/>
    </radialGradient>
    <linearGradient id="blood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d0a14"/>
      <stop offset="0.5" stop-color="#cc1220"/>
      <stop offset="1" stop-color="#8c0b16"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4a54"/>
      <stop offset="0.5" stop-color="#d3121f"/>
      <stop offset="1" stop-color="#6a0610"/>
    </linearGradient>
    <radialGradient id="soul">
      <stop offset="0" stop-color="#ffe6e1" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ff5a64" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#b30f1c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>

  <!-- souls -->
  <g>
    <circle cx="110" cy="250" r="34" fill="url(#soul)"/><circle cx="110" cy="250" r="7" fill="#ffe6e1"/>
    <circle cx="250" cy="150" r="22" fill="url(#soul)" opacity=".8"/><circle cx="250" cy="150" r="4.5" fill="#ffe6e1"/>
    <circle cx="410" cy="300" r="26" fill="url(#soul)" opacity=".7"/><circle cx="410" cy="300" r="5" fill="#ffe6e1"/>
    <circle cx="800" cy="290" r="30" fill="url(#soul)" opacity=".85"/><circle cx="800" cy="290" r="6" fill="#ffe6e1"/>
    <circle cx="960" cy="170" r="20" fill="url(#soul)" opacity=".75"/><circle cx="960" cy="170" r="4" fill="#ffe6e1"/>
    <circle cx="1090" cy="260" r="36" fill="url(#soul)"/><circle cx="1090" cy="260" r="7.5" fill="#ffe6e1"/>
    <circle cx="640" cy="340" r="16" fill="url(#soul)" opacity=".6"/><circle cx="640" cy="340" r="3.5" fill="#ffe6e1"/>
  </g>

  <!-- blood ceiling and drips -->
  <path d="M0 0H1200V30Q1150 44 1100 30T1000 32T900 30T800 33T700 30T600 32T500 30T400 33T300 30T200 32T100 30T0 33Z" fill="url(#blood)"/>
  <g fill="url(#blood)">
    <rect x="70"  y="20" width="14" height="110"/><circle cx="77"  cy="130" r="10"/>
    <rect x="190" y="20" width="9"  height="60"/><circle cx="194.5" cy="80" r="6.5"/>
    <rect x="330" y="20" width="16" height="150"/><circle cx="338" cy="170" r="11.5"/>
    <rect x="470" y="20" width="10" height="75"/><circle cx="475" cy="95" r="7"/>
    <rect x="590" y="20" width="12" height="125"/><circle cx="596" cy="145" r="9"/>
    <rect x="720" y="20" width="9"  height="55"/><circle cx="724.5" cy="75" r="6.5"/>
    <rect x="850" y="20" width="15" height="135"/><circle cx="857.5" cy="155" r="11"/>
    <rect x="990" y="20" width="10" height="90"/><circle cx="995" cy="110" r="7.5"/>
    <rect x="1120" y="20" width="13" height="115"/><circle cx="1126.5" cy="135" r="9.5"/>
  </g>

  <!-- title -->
  <text x="600" y="235" text-anchor="middle" font-family="Cinzel Decorative, Cinzel, Trajan Pro, Georgia, 'Times New Roman', serif" font-size="150" font-weight="900" letter-spacing="14" fill="#2b0509" transform="translate(0,5)">ANUBIS</text>
  <text x="600" y="235" text-anchor="middle" font-family="Cinzel Decorative, Cinzel, Trajan Pro, Georgia, 'Times New Roman', serif" font-size="150" font-weight="900" letter-spacing="14" fill="url(#title)">ANUBIS</text>

  <line x1="380" y1="268" x2="820" y2="268" stroke="#b30f1c" stroke-width="2"/>
  <text x="600" y="306" text-anchor="middle" font-family="Cinzel, Trajan Pro, Georgia, 'Times New Roman', serif" font-size="28" letter-spacing="4" fill="#ffd6d0">The Obsidian Control Plane</text>
  <text x="600" y="340" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="18" fill="#a68a82">Every agent is weighed before it passes, and the record never lies.</text>
</svg>
